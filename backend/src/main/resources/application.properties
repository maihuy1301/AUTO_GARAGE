# Load root .env when starting from repository root or backend/.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.application.name=garage-backend
server.port=${SERVER_PORT:8080}

# Database Configuration (SQL Server Docker / Local: default localhost:1433)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GarageManagementSystem;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YourPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS & WebSocket Allowed Origins (supports * or comma-separated patterns for LAN/Docker development)
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}

# Vehicle profile images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
storage.vehicle-images-dir=${VEHICLE_IMAGES_DIR:uploads/vehicles}

# SePay: disabled until a linked receiving account and webhook key are configured.
payments.sepay.enabled=${SEPAY_ENABLED:false}
payments.sepay.environment=${SEPAY_ENVIRONMENT:test}
payments.sepay.webhook-key=${SEPAY_WEBHOOK_KEY:}
payments.sepay.bank-code=${SEPAY_BANK_CODE:}
payments.sepay.bank-name=${SEPAY_BANK_NAME:}
payments.sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
payments.sepay.account-name=${SEPAY_ACCOUNT_NAME:}
# Customer support chat (local values may be set in root .env).
garage.support.enabled=${GARAGE_SUPPORT_ENABLED:false}
garage.support.gemini-enabled=${GARAGE_SUPPORT_GEMINI_ENABLED:false}
